services:
  order-db:
    image: postgres:16-alpine
    container_name: qpang-order-db
    environment:
      POSTGRES_DB: qpang_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data

volumes:
  order-db-data:
