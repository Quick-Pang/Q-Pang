spring:
  application:
    name: delivery-service

  datasource:
    url: jdbc:postgresql://localhost:5432/qpang_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8087

eureka:
  client:
    service-url:
      defaultZone: http://localhost:9090/eureka/