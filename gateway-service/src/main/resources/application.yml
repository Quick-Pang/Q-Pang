spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders/**

        - id: hub-service
          uri: lb://hub-service
          predicates:
            - Path=/hubs/**

        - id: company-service
          uri: lb://company-service
          predicates:
            - Path=/company/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/products/**

        - id: delivery-service
          uri: lb://delivery-service
          predicates:
            - Path=/deliveries/**,/messages/**,/ai/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:9090/eureka/

jwt:
  secret:
    key: ZGVsaXZlcnktc2VjcmV0LWtleS1kZWxpdmVyeS1zZWNyZXQta2V5LWRlbGl2ZXJ5