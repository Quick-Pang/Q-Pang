spring:
  application:
    name: hub-service
  datasource:
    url: jdbc:postgresql://localhost:5432/qpang_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:9090/eureka

server:
  port: 8085

kakao:
  api:
    key: ${KAKAO_API_KEY}